# font_family FiraCode
font_family Lilex Nerd Font
font_features LilexNerdFontMono-Regular -calt -liga -dlig -clig

disable_ligatures always

font_size 15.0

allow_bold_font no
bold_is_bright no
enable_audio_bell no

# Colors
foreground #ffffff
background #303030
# background #141415

color0  #282c34
color1  #e06c75
color2  #98c379
color3  #e5c07b
color4  #61afef
color5  #c678dd
color6  #56b6c2
color7  #c0c5ce
color8  #7f848e
color10 #98c37e
color12 #61afef
color13 #c678dd
color14 #56b6c2
color15 #ffffff

# Mouse
url_color                #F2D5CF
copy_on_select yes
mouse_map middle release ungrabbed paste_from_selection

map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard

enable_kitty_keyboard_encoding yes
map alt+* send_text all \x1b/
enable_true_color yes

map kitty_mod+enter launch --type=tab firefox {url}

# Set the cursor color to hot pink
# cursor #FF69B4
# cursor #F05DEB
# cursor #CC77F5
# cursor #ff26ff
cursor #ffffff

cursor_shape block
open_url_with default

map ctrl+; send_text all \x1f
map ctrl+' send_text all \x1e

shell_integration none
# shell_integration disabled
